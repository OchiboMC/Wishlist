plugins {
    id 'fabric-loom' version '1.11.8'
    id 'maven-publish'
}

version = mod_version
group = mod_group_id
base { archivesName = "${mod_id}-fabric-${minecraft_version}" }
java.toolchain.languageVersion = JavaLanguageVersion.of(17)

sourceSets.main.java {
    srcDir '../../../core/src/main/java'
    srcDir '../common/src/main/java'
}
sourceSets.main.resources.srcDir '../common/src/main/resources'

repositories {
    maven { url = 'https://repo.sleeping.town/' }
    maven { url = 'https://mvn.devos.one/snapshots/' }
    maven { url = 'https://mvn.devos.one/releases/' }
    maven { url = 'https://maven.createmod.net/' }
    maven { url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven' }
    maven { url = 'https://maven.jamieswhiteshirt.com/libs-release' }
    maven {
        url = 'https://maven.blamejared.com'
        content { includeGroup 'mezz.jei' }
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
    modCompileOnly "dev.emi:emi-fabric:${emi_version}:api"
    modCompileOnly "dev.emi:emi-fabric:${emi_version}"
    if (providers.gradleProperty('withEmi').map { it.toBoolean() }.getOrElse(true)) {
        modRuntimeOnly "dev.emi:emi-fabric:${emi_version}"
    }
    modCompileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    modCompileOnly "mezz.jei:jei-${minecraft_version}-fabric-api:${jei_version}"
    if (providers.gradleProperty('withJei').map { it.toBoolean() }.getOrElse(true)) {
        modRuntimeOnly "mezz.jei:jei-${minecraft_version}-fabric:${jei_version}"
    }
    modCompileOnly "com.simibubi.create:create-fabric:6.0.8.1+build.1744-mc1.20.1"
    if (providers.gradleProperty('withCreate').map { it.toBoolean() }.getOrElse(false)) {
        modRuntimeOnly "com.simibubi.create:create-fabric:6.0.8.1+build.1744-mc1.20.1"
    }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
